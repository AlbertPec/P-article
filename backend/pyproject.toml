[project]
name = "p-article-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# 2.1 has no wheels for Intel Macs, and the onnxruntime it needs has none for Python 3.14 there,
# so Intel Macs use 1.28.2 on Python 3.13.
pipeline = [
    "pymupdf==2.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pymupdf4llm==2.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pymupdf-layout==2.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pymupdf==1.28.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pymupdf4llm==1.28.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pymupdf-layout==1.28.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
p-article-server = "p_article_server.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["p_article_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
